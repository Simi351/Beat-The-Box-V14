function defaultStation(i){return {id:idNum("STATION_",i+1),name:"STATION "+(i+1),message:"Systemprüfung an Station "+(i+1)+" durchführen. Löst die physische Aufgabe und gebt anschließend den erhaltenen Code ein.",hints:["Prüft die Aufgabe noch einmal gemeinsam und achtet auf alle sichtbaren Informationen.","Teilt die Aufgabe in einzelne Schritte und vergleicht eure Beobachtungen.","Konzentriert euch auf das zentrale Lösungsprinzip der Station."]}}
function defaultTeam(i){return {id:idNum("TEAM_",i+1),name:["ALPHA","BRAVO","CHARLIE","DELTA","ECHO","FOXTROT"][i]||"TEAM "+(i+1),pin:String(1001+i)}}
function buildConfig(teamCount=6,stationCount=6,old=null){
 const teams=Array.from({length:teamCount},(_,i)=>old?.teams?.[i]?{...old.teams[i],id:idNum("TEAM_",i+1)}:defaultTeam(i));
 const stations=Array.from({length:stationCount},(_,i)=>old?.stations?.[i]?{...old.stations[i],id:idNum("STATION_",i+1),hints:[...(old.stations[i].hints||[]),"",""].slice(0,3)}:defaultStation(i));
 const routes={},answers={},fragments={},finals={};
 teams.forEach((t,ti)=>{
   const oldTeam=old?.teams?.find(x=>x.id===t.id)||old?.teams?.[ti];
   const oldId=oldTeam?.id;
   const validOldRoute=(oldId&&old?.routes?.[oldId]||[]).filter(sid=>stations.some(s=>s.id===sid));
   const missing=stations.map(s=>s.id).filter(sid=>!validOldRoute.includes(sid));
   routes[t.id]=(validOldRoute.length===stationCount?[...validOldRoute]:[...stations.slice(ti%stationCount),...stations.slice(0,ti%stationCount)].map(s=>s.id));
   answers[t.id]={}; fragments[t.id]={};
   stations.forEach((s,si)=>{
     answers[t.id][s.id]=oldId&&old?.answers?.[oldId]?.[s.id]!==undefined?old.answers[oldId][s.id]:String(1100+(ti*stationCount)+si);
     fragments[t.id][s.id]=oldId&&old?.fragments?.[oldId]?.[s.id]!==undefined?old.fragments[oldId][s.id]:String.fromCharCode(65+(si%26))+(ti+1);
   });
   finals[t.id]=oldId&&old?.finals?.[oldId]!==undefined?old.finals[oldId]:"LIFELINE";
 });
 return {version:14,teamCount,stationCount,teams,stations,routes,answers,fragments,finals,countdownSeconds:Number(old?.countdownSeconds||10)};
}
async function publicFrom(p){
 const answerHashes={},finalHashes={};
 for(const t of p.teams){answerHashes[t.id]={};for(const s of p.stations)answerHashes[t.id][s.id]=await sha(String(p.answers[t.id]?.[s.id]??"").trim().toUpperCase());finalHashes[t.id]=await sha(String(p.finals[t.id]??"").trim().toUpperCase())}
 return {version:14,teams:p.teams.map(t=>({id:t.id,name:t.name,pin:t.pin})),stations:p.stations,routes:p.routes,answerHashes,fragments:p.fragments,finalHashes,countdownSeconds:p.countdownSeconds};
}
function empty(runId,currentStationId=null){return {runId,started:false,step:0,done:[],fragments:[],hints:0,hintUsage:{},penalty:0,online:false,currentStationId,lastUpdate:0}}
function buildRunStates(p,runId){if(p.teams.length>p.stations.length)throw new Error("Für den autonomen Stationsbetrieb müssen mindestens so viele Stationen wie Teams vorhanden sein.");const all={};p.teams.forEach((t,i)=>all[t.id]=empty(runId,p.stations[i].id));return all}
function teamIds(){return (priv?.teams||[]).map(t=>t.id)}
function st(id){return states[id]||empty(global.runId||0)}
function route(id){return priv?.routes?.[id]||[]}
function currentStationId(id){const s=st(id),r=route(id);return s.step<r.length?r[s.step]:null}
function stationById(id){return priv?.stations?.find(s=>s.id===id)||null}
function teamById(id){return priv?.teams?.find(t=>t.id===id)||null}
function missionRunning(){return global.status==="running"}

async function boot(){
 try{const app=initializeApp(firebaseConfig);db=getDatabase(app);auth=getAuth(app);onAuthStateChanged(auth,async u=>{user=u;if(u&&String(u.email||"").toLowerCase()===String(gameMasterEmail).toLowerCase()){attach()}else if(u){$("loginMsg").innerHTML='<div class="terminal red">FALSCHES GAME-MASTER-KONTO<br>Angemeldet als: '+esc(u.email||"unbekannt")+'<br>Erwartet: '+esc(gameMasterEmail)+'</div>';await signOut(auth)}})}

function attach(){if(attached)return;attached=true;$("login").classList.add("hidden");$("dash").classList.remove("hidden");onValue(ref(db,ROOT+"/privateConfig"),s=>{priv=s.val();priv?render():renderInit()});onValue(ref(db,ROOT+"/teams"),s=>{states=s.val()||{};safeRender()});onValue(ref(db,ROOT+"/globalState"),s=>{global=s.val()||{};safeRender()})}
function renderInit(){$("dash").innerHTML='<div class="card hero"><div class="title">&gt;&gt; V13 FIRST START</div><p class="muted">Neue flexible Datenstruktur initialisieren. Die bestehende V12 wird nicht berührt.</p><button id="init" class="primary">V13 INITIALISIEREN</button></div>';$("init").onclick=initialize}
async function initialize(){const p=buildConfig(6,6),pub=await publicFrom(p),runId=Date.now(),all={};p.teams.forEach(t=>all[t.id]=empty(runId));await set(ref(db,ROOT+"/privateConfig"),p);await set(ref(db,ROOT+"/publicConfig"),pub);await set(ref(db,ROOT+"/globalState"),{runId,status:"setup",countdownStartedAt:0,countdownSeconds:p.countdownSeconds});await set(ref(db,ROOT+"/teams"),all)}

function render(){
 if(!priv)return;
 const ids=teamIds(),total=ids.length,online=ids.filter(id=>st(id).online).length,stationCount=priv.stations.length,running=missionRunning();
 $("dash").innerHTML=`
 ${online===total&&total?`<div class="card hero global"><div class="title">${online} / ${total} ONLINE</div><div class="big">GLOBAL LIFELINE READY</div></div>`:""}
 <div class="card hero"><div class="title">LIVE MISSION CONTROL // V13 FLEX</div><div class="terminal">STATUS: ${running?"MISSION ACTIVE":"SETUP MODE"}\nFIELD UNITS ONLINE: ${online} / ${total}\nSTATIONEN: ${stationCount}</div><div class="row" style="margin-top:12px"><button id="newMission" class="primary">MISSION STARTEN / RESET</button><button id="setupMode" class="warn">SETUP FREIGEBEN</button><button id="logoutBtn">LOGOUT</button></div><label>Countdown Sekunden (3–120)</label><div class="row"><input id="cd" type="number" min="3" max="120" value="${Number(global.countdownSeconds??priv.countdownSeconds??10)}"><button id="saveCountdown" type="button">COUNTDOWN SPEICHERN</button></div><div id="cdMsg" class="small muted">Aktuell gespeichert: ${Number(global.countdownSeconds??priv.countdownSeconds??10)} Sekunden</div></div>
 <div class="card" style="margin-top:14px"><div class="title">MISSION SETUP</div><p class="small muted">Strukturänderungen sind nur im SETUP MODE möglich. Beim Ändern der Anzahl werden Teamstände zurückgesetzt; vorhandene Inhalte werden soweit möglich übernommen.</p><div class="row"><div><label>Anzahl Teams (${MIN_COUNT}–${MAX_COUNT})</label><input id="teamCount" type="number" min="${MIN_COUNT}" max="${MAX_COUNT}" value="${total}" ${running?"disabled":""}></div><div><label>Anzahl Stationen (${MIN_COUNT}–${MAX_COUNT})</label><input id="stationCount" type="number" min="${MIN_COUNT}" max="${MAX_COUNT}" value="${stationCount}" ${running?"disabled":""}></div></div><button id="applyStructure" class="primary" ${running?"disabled":""}>STRUKTUR ÜBERNEHMEN</button></div>
 <div class="grid" style="margin-top:14px">${priv.teams.map(t=>{const s=st(t.id),sid=s.currentStationId,c=sid?stationById(sid):null,totalS=priv.stations.length,done=Array.isArray(s.done)?s.done.length:0;return `<div class="card ${s.online?"online-card":""}"><div class="row"><div class="title">${esc(t.name)}</div><div style="flex:0"><span class="live-dot ${s.online?"on":""}"></span></div></div><div class="${s.online?"online":"muted"}" style="font-size:20px;font-weight:900">${s.online?"ONLINE":s.started?"ACTIVE":"OFFLINE"}</div><p>${c?`AKTUELL EINGECHECKT: ${esc(c.name)}`:done>=totalS?`FINAL ACCESS • ${done}/${totalS} AUFGABEN ABGESCHLOSSEN`:`WARTET AUF AUSWAHL`}</p><div class="small muted">ABGESCHLOSSEN: ${done} / ${totalS}</div><div class="progress"><div style="width:${totalS?Math.min(100,done/totalS*100):0}%"></div></div><p class="small muted">Hints: ${s.hints||0} • Penalty: ${s.penalty||0} • Station: ${c?esc(c.name):"frei"}</p><div class="row"><button data-reset="${t.id}" class="danger">RESET TEAM</button></div></div>`}).join("")}</div>
 <div class="card" style="margin-top:14px"><div class="title">TEAMS & ZUGANGSCODES</div>${priv.teams.map((t,i)=>`<div class="core"><b>TEAM ${i+1}</b><label>Name</label><input id="tn_${t.id}" value="${esc(t.name)}"><label>4-stelliger Teamcode</label><input id="pin_${t.id}" value="${esc(t.pin)}" maxlength="4" inputmode="numeric"></div>`).join("")}<button id="saveTeams">TEAMS SPEICHERN</button></div>
 <div class="card" style="margin-top:14px"><div class="title">STATIONSWAHL-MODUS</div><p class="small muted">Die feste Wechselmatrix wird in diesem Modus nicht verwendet. Teams wählen nach Abschluss jeder Aufgabe selbst eine aktuell freie Station. Eine Station bleibt für andere Teams gesperrt, solange sie belegt ist.</p><div style="overflow:auto"><table class="matrix-table"><thead><tr><th>TEAM</th>${Array.from({length:stationCount},(_,i)=>`<th>POS ${i+1}</th>`).join("")}</tr></thead><tbody>${priv.teams.map(t=>`<tr><th>${esc(t.name)}</th>${route(t.id).map((sid,p)=>`<td><select id="r_${t.id}_${p}">${priv.stations.map(s=>`<option value="${s.id}" ${s.id===sid?"selected":""}>${esc(s.name)}</option>`).join("")}</select></td>`).join("")}</tr>`).join("")}</tbody></table></div><button id="saveRoutes">KONFIGURATION PRÜFEN / SPEICHERN</button></div>
 <div class="card" style="margin-top:14px"><div class="title">STATIONEN & SYSTEMMELDUNGEN</div>${priv.stations.map((s,i)=>`<div class="core"><b>STATION ${i+1}</b><label>Name</label><input id="sn_${s.id}" value="${esc(s.name)}"><label>System Message</label><textarea id="sm_${s.id}">${esc(s.message)}</textarea><label>Hinweis 1</label><textarea id="h_${s.id}_0">${esc(s.hints?.[0]||"")}</textarea><label>Hinweis 2</label><textarea id="h_${s.id}_1">${esc(s.hints?.[1]||"")}</textarea><label>Hinweis 3</label><textarea id="h_${s.id}_2">${esc(s.hints?.[2]||"")}</textarea></div>`).join("")}<button id="saveStations" class="primary">STATIONEN & HINWEISE SPEICHERN</button></div>
 <div class="card" style="margin-top:14px"><div class="title">TEAM SOLUTIONS</div><div style="overflow:auto"><table class="matrix-table"><thead><tr><th>TEAM</th>${priv.stations.map(s=>`<th>${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${priv.teams.map(t=>`<tr><th>${esc(t.name)}</th>${priv.stations.map(s=>`<td><input id="a_${t.id}_${s.id}" value="${esc(priv.answers?.[t.id]?.[s.id]||"")}"></td>`).join("")}</tr>`).join("")}</tbody></table></div><button id="saveAnswers">LÖSUNGEN SPEICHERN</button></div>
 <div class="card" style="margin-top:14px"><div class="title">TEAM FRAGMENTS</div><div style="overflow:auto"><table class="matrix-table"><thead><tr><th>TEAM</th>${priv.stations.map(s=>`<th>${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${priv.teams.map(t=>`<tr><th>${esc(t.name)}</th>${priv.stations.map(s=>`<td><input id="f_${t.id}_${s.id}" value="${esc(priv.fragments?.[t.id]?.[s.id]||"")}"></td>`).join("")}</tr>`).join("")}</tbody></table></div><button id="saveFragments">FRAGMENTE SPEICHERN</button></div>
 <div class="card" style="margin-top:14px"><div class="title">FINAL CODES</div>${priv.teams.map(t=>`<div class="core"><b>${esc(t.name)}</b><input id="fin_${t.id}" value="${esc(priv.finals?.[t.id]||"")}"></div>`).join("")}<button id="saveFinals">FINALCODES SPEICHERN</button></div>`;
 document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>forceNext(b.dataset.next));document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>resetTeam(b.dataset.reset));
 $("newMission").onclick=newMission;$("setupMode").onclick=enterSetup;$("logoutBtn").onclick=()=>signOut(auth);$("saveCountdown").onclick=saveCountdown;$("applyStructure").onclick=applyStructure;$("saveTeams").onclick=saveTeams;$("saveRoutes").onclick=saveRoutes;$("saveStations").onclick=saveStations;$("saveAnswers").onclick=saveAnswers;$("saveFragments").onclick=saveFragments;$("saveFinals").onclick=saveFinals;

function configIssues(p){
 const issues=[],stationIds=(p?.stations||[]).map(s=>s.id),teamIds=(p?.teams||[]).map(t=>t.id);
 if(!stationIds.length)issues.push("Keine Stationen konfiguriert.");
 if(new Set(stationIds).size!==stationIds.length)issues.push("Stations-IDs sind nicht eindeutig.");
 if(new Set(teamIds).size!==teamIds.length)issues.push("Team-IDs sind nicht eindeutig.");
 for(const t of (p?.teams||[])){const r=p?.routes?.[t.id]||[];if(r.length!==stationIds.length||new Set(r).size!==stationIds.length||r.some(id=>!stationIds.includes(id)))issues.push("Route von "+t.name+" enthält nicht jede Station genau einmal.");for(const sid of stationIds){if(!String(p?.answers?.[t.id]?.[sid]??"").trim())issues.push("Lösungscode fehlt: "+t.name+" / "+(p.stations.find(s=>s.id===sid)?.name||sid));if(!String(p?.fragments?.[t.id]?.[sid]??"").trim())issues.push("Fragment fehlt: "+t.name+" / "+(p.stations.find(s=>s.id===sid)?.name||sid));}if(!String(p?.finals?.[t.id]??"").trim())issues.push("Finalcode fehlt: "+t.name);}
 return issues;
}
function requireValidConfig(p){const issues=configIssues(p);if(issues.length){alert("KONFIGURATION FEHLERHAFT:\n\n"+issues.join("\n"));return false}return true}
function countdownValue(){const el=$("cd"),n=Number(el?.value);return Number.isFinite(n)?Math.max(3,Math.min(120,Math.round(n))):10}
async function saveCountdown(){
 const sec=countdownValue();
 try{
  const p=clone(priv);p.countdownSeconds=sec;
  await set(ref(db,ROOT+"/privateConfig"),p);
  await set(ref(db,ROOT+"/publicConfig"),await publicFrom(p));
  await update(ref(db,ROOT+"/globalState"),{countdownSeconds:sec});
  priv=p;if($("cd"))$("cd").value=sec;if($("cdMsg"))$("cdMsg").textContent="Gespeichert: "+sec+" Sekunden";
 }catch(e){console.error("saveCountdown",e);if($("cdMsg"))$("cdMsg").innerHTML='<span class="red">COUNTDOWN KONNTE NICHT GESPEICHERT WERDEN: '+esc(e.code||e.message||String(e))+'</span>'}
}
async function sync(p){if(!requireValidConfig(p))throw new Error("INVALID_CONFIG");priv=p;p.teamCount=p.teams.length;p.stationCount=p.stations.length;p.countdownSeconds=countdownValue();await set(ref(db,ROOT+"/privateConfig"),p);await set(ref(db,ROOT+"/publicConfig"),await publicFrom(p));await update(ref(db,ROOT+"/globalState"),{countdownSeconds:p.countdownSeconds})}
async function enterSetup(){if(!confirm("SETUP MODE freigeben? Eine laufende Mission wird beendet und alle Team-Fortschritte werden zurückgesetzt."))return;const runId=Date.now(),all=buildRunStates(priv,runId);await set(ref(db,ROOT+"/teams"),all);await set(ref(db,ROOT+"/stationClaims"),{});await set(ref(db,ROOT+"/globalState"),{runId,status:"setup",countdownStartedAt:0,countdownSeconds:countdownValue()})}
async function newMission(){if(priv.teams.length>priv.stations.length){alert("Für den autonomen Stationsbetrieb müssen mindestens so viele Stationen wie Teams vorhanden sein.");return}if(!requireValidConfig(priv))return;if(!confirm("Neue Mission starten und alle Teams auf Anfang setzen?"))return;const sec=countdownValue();const p=clone(priv);p.countdownSeconds=sec;const runId=Date.now(),all=buildRunStates(p,runId),claims=Object.fromEntries(p.stations.slice(0,p.teams.length).map((st,i)=>[st.id,p.teams[i].id]));await sync(p);await set(ref(db,ROOT+"/teams"),all);await set(ref(db,ROOT+"/stationClaims"),claims);await set(ref(db,ROOT+"/globalState"),{runId,status:"running",countdownStartedAt:0,countdownSeconds:sec});alert("Mission gestartet. Jedes Team hat eine eigene Startaufgabe.")}
async function applyStructure(){if(missionRunning()){alert("Struktur kann während einer laufenden Mission nicht geändert werden.");return}const tc=Number($("teamCount").value),sc=Number($("stationCount").value);if(!Number.isInteger(tc)||!Number.isInteger(sc)||tc<MIN_COUNT||tc>MAX_COUNT||sc<MIN_COUNT||sc>MAX_COUNT){alert("Teams und Stationen müssen zwischen "+MIN_COUNT+" und "+MAX_COUNT+" liegen.");return}if(!confirm(`Struktur auf ${tc} Teams und ${sc} Stationen ändern? Team-Fortschritte werden zurückgesetzt.`))return;const p=buildConfig(tc,sc,priv);await sync(p);const runId=Date.now(),all=buildRunStates(p,runId);await set(ref(db,ROOT+"/teams"),all);await set(ref(db,ROOT+"/stationClaims"),{});await set(ref(db,ROOT+"/globalState"),{runId,status:"setup",countdownStartedAt:0,countdownSeconds:p.countdownSeconds})}
async function saveTeams(){const p=clone(priv),pins=[];for(const t of p.teams){const name=$("tn_"+t.id).value.trim(),pin=$("pin_"+t.id).value.trim();if(!name){alert("Jedes Team benötigt einen Namen.");return}if(!/^\d{4}$/.test(pin)){alert("Jeder Teamcode muss genau 4-stellig sein.");return}t.name=name;t.pin=pin;pins.push(pin)}if(new Set(pins).size!==pins.length){alert("Teamcodes müssen eindeutig sein.");return}await sync(p);alert("Teams gespeichert.")}
async function saveRoutes(){const p=clone(priv),valid=new Set(p.stations.map(s=>s.id));for(const t of p.teams){const a=p.stations.map((_,i)=>$("r_"+t.id+"_"+i).value);if(a.some(x=>!valid.has(x))||new Set(a).size!==p.stations.length){alert("Jedes Team muss jede Station genau einmal besuchen.");return}p.routes[t.id]=a}await sync(p);alert("Wechselmatrix gespeichert.")}
async function saveStations(){const p=clone(priv);for(const s of p.stations){const name=$("sn_"+s.id).value.trim();if(!name){alert("Jede Station benötigt einen Namen.");return}s.name=name;s.message=$("sm_"+s.id).value.trim();s.hints=[0,1,2].map(i=>$("h_"+s.id+"_"+i).value.trim())}await sync(p);alert("Stationen und Hinweise gespeichert.")}
async function saveAnswers(){const p=clone(priv);for(const t of p.teams)for(const s of p.stations)p.answers[t.id][s.id]=$("a_"+t.id+"_"+s.id).value.trim();await sync(p);alert("Lösungen gespeichert.")}
async function saveFragments(){const p=clone(priv);for(const t of p.teams)for(const s of p.stations)p.fragments[t.id][s.id]=$("f_"+t.id+"_"+s.id).value.trim();await sync(p);alert("Fragmente gespeichert.")}
async function saveFinals(){const p=clone(priv);for(const t of p.teams)p.finals[t.id]=$("fin_"+t.id).value.trim();await sync(p);alert("Finalcodes gespeichert.")}
async function forceNext(id){alert("FORCE NEXT ist im freien Stationswahl-Modus deaktiviert. Das Team wählt seine nächste freie Station selbst.")}
async function resetTeam(id){const t=teamById(id);if(!confirm("Team "+(t?.name||id)+" zurücksetzen?"))return;const current=st(id);if(current.currentStationId){await runTransaction(ref(db,ROOT+"/stationClaims/"+current.currentStationId),v=>v===id?null:v)}await set(ref(db,ROOT+"/teams/"+id),empty(global.runId||Date.now(),null))}
function tickClock(){$("clock").textContent=new Date().toLocaleTimeString("de-DE")}tickClock();setInterval(tickClock,1000);
function startMatrix(){const c=document.getElementById("matrix"),x=c.getContext("2d"),chars="01アイウエオABCDEFGHIJKLMNOPQRSTUVWXYZ#$%",size=15;let drops=[];function resize(){c.width=innerWidth;c.height=innerHeight;drops=Array(Math.max(1,Math.floor(c.width/size))).fill(1)}resize();addEventListener("resize",resize);function f(){x.fillStyle="rgba(1,3,1,.10)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#00ff66";x.font=size+"px monospace";drops.forEach((y,i)=>{x.fillText(chars[Math.floor(Math.random()*chars.length)],i*size,y*size);if(y*size>c.height&&Math.random()>.975)drops[i]=0;drops[i]++});requestAnimationFrame(f)}f()}
startMatrix();boot();
</script></body></html>
